<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation</title>
</head>
<script type="module">
async function getLocation() {
    let coords = {}

    return new Promise(async(resolve, reject) => {
        if('geolocation' in navigator) {
            await navigator.geolocation.getCurrentPosition((pos) => {
                
                coords["latitude"] = pos.coords.latitude
                coords["longitude"] = pos.coords.longitude

                resolve(coords)
            })
        } else {
            const error = 'Navigator not allowed geolocation'
            reject(error)
        }
    })
    return coords
}

const { longitude, latitude } = await getLocation()

const response = await fetch('https://geolocation-solid.vercel.app/weather', {
    method: 'POST',
    headers: {
        'Content-Type': 'application/json'
    },
    body: JSON.stringify({ longitude: longitude, latitude: latitude })
})
console.log(response)
</script>
<body>
    
</body>
</html>
